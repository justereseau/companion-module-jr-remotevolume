name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand on the release-please branch: PRs opened with the built-in GITHUB_TOKEN do not
  # trigger workflows, and these checks are required to merge the release PR.
  workflow_dispatch:

permissions:
  contents: read

env:
  # The app the e2e job builds and runs the module against. Bump it to test a newer app.
  REMOTE_VOLUME_REPOSITORY: Justereseau/companion-remote-volume
  REMOTE_VOLUME_REF: f8998a8718433e5c0ccf8c4de449767b3e69d1bb

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Unit tests with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      # Install scripts are not needed for unit tests.
      - run: yarn install --frozen-lockfile --ignore-scripts
      # The unit tests drive the module against a fake Remote Volume app (a local WebSocket server).
      # Fails below 90% lines, 80% branches, 90% functions.
      - name: Unit tests with coverage thresholds
        run: yarn test:coverage

  # The real module code against the real all-Rust app, built from source, controlling a real audio
  # backend (a PulseAudio null sink stands in for the sound card).
  e2e:
    name: End-to-end (real remote-volume app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.REMOTE_VOLUME_REPOSITORY }}
          ref: ${{ env.REMOTE_VOLUME_REF }}
          path: remote-volume-app
          persist-credentials: false

      # libpulse for building, plus a virtual sound card: a PulseAudio null sink as default output.
      - name: libpulse and a virtual sound card
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpulse-dev pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_sink
          pactl set-default-sink ci_sink
          pactl list short sinks

      # core/rust-toolchain.toml selects the channel and components.
      - name: Rust toolchain
        working-directory: remote-volume-app/core
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: remote-volume-app/core

      - name: Build remote-volume
        working-directory: remote-volume-app/core
        run: cargo build --release --locked --bin remote-volume

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: End-to-end tests
        env:
          RV_BIN: ${{ github.workspace }}/remote-volume-app/core/target/release/remote-volume
        run: yarn test:e2e

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile --ignore-scripts
      - run: yarn format:check

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile --ignore-scripts
      # Only what ships in the module: the build tooling is a devDependency.
      - name: Audit production dependencies
        run: yarn audit --groups dependencies --level high

  dependency-review:
    name: Dependency review
    # Also on manual runs of a branch (e.g. the release PR), comparing it against main.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ github.event.pull_request.base.sha || 'main' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  conventional-commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # release-please derives versions and the changelog from commit messages on main, so the PR
      # title (squash merges) and every commit (merge commits) must follow Conventional Commits.
      - name: Check PR title and commit messages
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          re='^(feat|fix|perf|refactor|revert|docs|test|build|ci|chore|style)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          if ! [[ "$TITLE" =~ $re ]]; then
            echo "::error::PR title is not a Conventional Commit: $TITLE"; bad=1
          fi
          while IFS= read -r subject; do
            if ! [[ "$subject" =~ $re ]]; then
              echo "::error::Commit message is not a Conventional Commit: $subject"; bad=1
            fi
          done < <(git log --no-merges --format=%s "$BASE..$HEAD")
          if [[ $bad == 1 ]]; then
            echo "Use e.g. 'fix: …', 'feat: …', 'feat!: …' (breaking), 'chore: …', 'ci: …', 'docs: …'." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
