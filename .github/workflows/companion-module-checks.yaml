name: Companion Module Checks

on:
  push:
    branches: [main]
  # "Package module" is required to merge, and a release PR gets no push event of its own.
  pull_request:
  # Run by hand on the release-please branch: PRs opened with the built-in GITHUB_TOKEN do not
  # trigger workflows.
  workflow_dispatch:

jobs:
  check:
    name: Check module

    if: ${{ !contains(github.repository, 'companion-module-template-') }}

    permissions:
      packages: read

    uses: bitfocus/actions/.github/workflows/module-checks.yaml@ab3cc0686dd4c46ea9202e298858561e2dea1e3f # main
    # with:
    #   upload-artifact: true # uncomment this to upload the built package as an artifact to this workflow that you can download and share with others

