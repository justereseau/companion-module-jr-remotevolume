name: Release

on:
  push:
    branches: [main]
  # Finish a draft release when the run on main failed before publishing it.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Build, attach the package to this draft release and publish it (e.g. v1.2.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# release-please keeps a release PR (version bump + CHANGELOG) up to date from the Conventional
# Commits on main. Merging that PR creates the tag and a draft GitHub release. Without the
# optional RELEASE_PLEASE_TOKEN secret it uses the built-in GITHUB_TOKEN, so the release PR does
# not trigger CI by itself: run the CI and Companion Module Checks workflows manually on its branch
# before merging. Needs Settings > Actions > General > "Allow GitHub Actions to create and approve
# pull requests".
# The module package (.tgz, import it on Companion's Modules page) is built from the tagged commit
# and attached to the draft, which is then published. With the repository setting "Immutable
# releases", publishing locks the package and the tag: to fix a bad release, make a new one.
jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    env:
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      # RELEASE_PLEASE_TOKEN is optional: a personal access token (or GitHub App token) of a
      # maintainer, with Contents and Pull requests write access. Set, the release PR is opened
      # with it, so CI starts by itself on that PR, and GitHub merges the PR once the required
      # checks pass. Not set, it falls back to the built-in token and the PR is merged by hand.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The merge must be made with that same token: a merge made with the built-in token would not
      # start the run on `main` that creates the tag and the release. So nothing is enabled without it.
      - name: Merge the release PR when its checks pass
        if: steps.release.outputs.prs_created == 'true' && env.HAS_RELEASE_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for pr in $(gh pr list --state open --label 'autorelease: pending' --json number --jq '.[].number'); do
            gh pr merge "$pr" --auto --merge
          done

  package:
    name: Attach module package and publish release
    needs: release-please
    # always(): release-please is skipped on manual runs, which must not skip this job.
    if: >-
      always() &&
      (needs.release-please.outputs.release_created == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
    steps:
      # A published release is final.
      - name: Check that the release is a draft
        run: |
          is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft --repo "$GITHUB_REPOSITORY")
          if [[ "$is_draft" != "true" ]]; then
            echo "::error::$TAG is already published and must not change. Make a new release instead."
            exit 1
          fi

      # Build exactly what was tagged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.release_tag }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile --ignore-scripts
      - name: Build the module package
        run: yarn companion-module-build

      # --clobber only replaces files of this draft, from an earlier attempt that did not finish.
      - name: Upload to the draft release
        run: |
          shopt -s nullglob
          files=(jr-remotevolume-*.tgz)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one package, found: ${files[*]}"; exit 1
          fi
          sha256sum "${files[0]}" > SHA256SUMS.txt
          gh release upload "$TAG" "${files[0]}" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

      # The release is out either way: this reports that the repository setting was turned off.
      - name: Check that the published release is immutable
        run: |
          for attempt in 1 2 3 4 5 6; do
            immutable=$(gh release view "$TAG" --json isImmutable --jq .isImmutable --repo "$GITHUB_REPOSITORY")
            if [[ "$immutable" == "true" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::$TAG is published but not immutable. Turn on Immutable releases in the repository settings."
          exit 1
